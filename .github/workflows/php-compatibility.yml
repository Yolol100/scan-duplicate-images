name: PHP compatibility

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.3'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | sort -z \
            | xargs -0 -n1 php -l

      - name: Scan result regression
        run: php tests/scan-results-regression.php

  wordpress-runtime:
    name: WordPress ${{ matrix.wp }} / PHP ${{ matrix.php }} integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.0'
            php: '7.4'
          - wp: '7.0'
            php: '8.3'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
      - name: Install checked WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum --check --strict
      - name: Execute isolated WordPress smoke
        shell: bash
        run: |
          set -euo pipefail
          wp_root="$RUNNER_TEMP/media-insight-wordpress"
          plugin_dir="$wp_root/wp-content/plugins/media-insight"
          php /tmp/wp-cli.phar core download --path="$wp_root" --version='${{ matrix.wp }}' --locale=en_US
          php /tmp/wp-cli.phar config create --path="$wp_root" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          php /tmp/wp-cli.phar config set WP_DEBUG true --raw --path="$wp_root"
          php /tmp/wp-cli.phar config set WP_DEBUG_LOG true --raw --path="$wp_root"
          php /tmp/wp-cli.phar core install --path="$wp_root" --url=http://media-insight.test --title='Media Insight CI' --admin_user=admin --admin_password='ci-isolated-password' --admin_email=ci@example.invalid --skip-email
          mkdir -p "$plugin_dir"
          rsync -a --exclude='.git/' "$GITHUB_WORKSPACE/" "$plugin_dir/"
          php /tmp/wp-cli.phar plugin activate media-insight --path="$wp_root"
          php /tmp/wp-cli.phar eval-file "$plugin_dir/tests/wordpress-runtime-smoke.php" --path="$wp_root"
          if test -f "$wp_root/wp-content/debug.log" && grep -Eqi 'PHP (Fatal error|Parse error|Warning|Deprecated|Notice)' "$wp_root/wp-content/debug.log"; then
            cat "$wp_root/wp-content/debug.log"
            exit 1
          fi
